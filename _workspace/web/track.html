<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>등하원 차량 위치</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="header">
    <h1 id="header-title">등하원 차량 위치</h1>
  </header>

  <div id="map-container">
    <div id="map"></div>
    <div id="no-vehicles-overlay" class="hidden">
      <p>현재 운행 중인 차량이 없습니다</p>
    </div>
    <div id="connection-overlay" class="hidden">
      <p>연결 중...</p>
    </div>
  </div>

  <div id="card-list"></div>

  <div id="vehicle-card" class="hidden">
    <div id="card-handle"></div>
    <div id="card-body">
      <div id="card-status-dot"></div>
      <div id="card-info">
        <div id="card-name"></div>
        <div id="card-route"></div>
        <div id="card-status-text"></div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=b31a2a5719b274dfd7ff44864905bd04"></script>
  <script src="/app.js"></script>
</body>
</html>
